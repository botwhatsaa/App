<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tanzania Dating</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff5f8;
  color:#24131b;
}

header{
  background:linear-gradient(135deg,#ff174f,#e60046);
  color:white;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:21px;
  font-weight:bold;
}

.header-actions{
  display:flex;
  gap:8px;
  align-items:center;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 15px;
  cursor:pointer;
  font-weight:bold;
}

.primary-btn{
  background:#ff174f;
  color:white;
}

.secondary-btn{
  background:#eee;
  color:#222;
}

.danger-btn{
  background:#d60000;
  color:white;
}

.notification-btn{
  background:white;
  color:#ff174f;
  position:relative;
  font-size:18px;
  padding:8px 11px;
}

.badge{
  position:absolute;
  top:-5px;
  right:-5px;
  background:#222;
  color:white;
  min-width:20px;
  height:20px;
  border-radius:50%;
  font-size:11px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.hidden{
  display:none !important;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.auth-box{
  max-width:430px;
  margin:50px auto;
  background:white;
  padding:25px;
  border-radius:18px;
  box-shadow:0 5px 25px rgba(0,0,0,.08);
}

.auth-box h1{
  text-align:center;
  color:#ff174f;
}

input,
select,
textarea{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  margin:7px 0 12px;
  font-size:15px;
  outline:none;
}

textarea{
  resize:vertical;
  min-height:90px;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#ff174f;
}

.auth-box button{
  width:100%;
}

.switch{
  text-align:center;
  margin-top:15px;
}

.switch button{
  width:auto;
  padding:0;
  background:none;
  color:#ff174f;
}

nav{
  background:white;
  border-bottom:1px solid #eee;
  padding:10px;
  display:flex;
  gap:8px;
  overflow-x:auto;
}

nav button{
  white-space:nowrap;
  background:#f5f5f5;
}

nav button.active{
  background:#ff174f;
  color:white;
}

.section-title{
  margin-top:5px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:18px;
}

.card{
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
}

.card-photo{
  width:100%;
  height:260px;
  object-fit:cover;
  background:#f1f1f1;
}

.no-photo{
  height:260px;
  background:#f5dce5;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:60px;
}

.card-body{
  padding:15px;
}

.card-name{
  font-size:20px;
  font-weight:bold;
}

.muted{
  color:#777;
  font-size:14px;
  margin:5px 0;
}

.bio{
  margin:10px 0;
  line-height:1.4;
}

.card-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.card-actions button{
  flex:1;
}

.profile-box,
.notifications-box,
.chat-box{
  background:white;
  border-radius:18px;
  padding:20px;
  box-shadow:0 4px 18px rgba(0,0,0,.07);
}

.profile-photo{
  width:150px;
  height:150px;
  object-fit:cover;
  border-radius:50%;
  display:block;
  margin:0 auto 15px;
  background:#eee;
}

.photo-preview{
  text-align:center;
  margin:15px 0;
}

.photo-preview img{
  width:150px;
  height:150px;
  object-fit:cover;
  border-radius:50%;
}

.notification{
  border-bottom:1px solid #eee;
  padding:14px 5px;
}

.notification:last-child{
  border-bottom:0;
}

.notification.unread{
  background:#fff0f4;
  border-radius:10px;
  padding:14px;
}

.notification-title{
  font-weight:bold;
}

.notification-message{
  margin-top:5px;
}

.notification-time{
  font-size:12px;
  color:#888;
  margin-top:5px;
}

.chat-messages{
  height:400px;
  overflow-y:auto;
  background:#fafafa;
  border-radius:12px;
  padding:15px;
  margin-bottom:12px;
}

.message{
  max-width:75%;
  padding:10px 13px;
  border-radius:15px;
  margin-bottom:9px;
  clear:both;
}

.message.mine{
  background:#ff174f;
  color:white;
  margin-left:auto;
  border-bottom-right-radius:4px;
}

.message.theirs{
  background:#e9e9e9;
  color:#222;
  margin-right:auto;
  border-bottom-left-radius:4px;
}

.message-time{
  font-size:10px;
  opacity:.7;
  margin-top:4px;
}

.chat-input{
  display:flex;
  gap:8px;
}

.chat-input input{
  margin:0;
}

.empty{
  text-align:center;
  padding:35px 10px;
  color:#777;
}

.error{
  color:#c40000;
  background:#ffe5e5;
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
}

.success{
  color:#087a2a;
  background:#e4ffe9;
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
}

.loading{
  text-align:center;
  padding:30px;
}

.form-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

@media(max-width:600px){
  .container{
    padding:12px;
  }

  .form-row{
    grid-template-columns:1fr;
    gap:0;
  }

  .card-photo,
  .no-photo{
    height:230px;
  }
}
</style>
</head>

<body>

<header id="mainHeader" class="hidden">
  <div class="logo">❤️ Tanzania Dating</div>

  <div class="header-actions">
    <button
      class="notification-btn"
      type="button"
      onclick="showNotifications()"
      aria-label="Notifications"
    >
      🔔
      <span id="notificationBadge" class="badge hidden">0</span>
    </button>

    <button
      class="secondary-btn"
      type="button"
      onclick="logout()"
    >
      Toka
    </button>
  </div>
</header>


<!-- =========================
     LOGIN
========================= -->

<section id="loginSection">
  <div class="auth-box">

    <h1>❤️ Tanzania Dating</h1>

    <p style="text-align:center">
      Ingia kwenye account yako
    </p>

    <div id="loginMessage"></div>

    <form id="loginForm">

      <label>Email</label>

      <input
        id="loginEmail"
        type="email"
        placeholder="Weka email yako"
        autocomplete="email"
        required
      >

      <label>Password</label>

      <input
        id="loginPassword"
        type="password"
        placeholder="Weka password yako"
        autocomplete="current-password"
        required
      >

      <button
        id="loginBtn"
        class="primary-btn"
        type="submit"
      >
        Login
      </button>

    </form>

    <div class="switch">
      Huna account?
      <button
        type="button"
        onclick="showRegister()"
      >
        Jisajili
      </button>
    </div>

  </div>
</section>


<!-- =========================
     REGISTER
========================= -->

<section id="registerSection" class="hidden">

  <div class="auth-box">

    <h1>Jisajili ❤️</h1>

    <div id="registerMessage"></div>

    <form id="registerForm">

      <label>Jina</label>

      <input
        id="registerName"
        type="text"
        placeholder="Mfano: Daniel"
        required
      >

      <label>Email</label>

      <input
        id="registerEmail"
        type="email"
        placeholder="email@example.com"
        autocomplete="email"
        required
      >

      <label>Password</label>

      <input
        id="registerPassword"
        type="password"
        placeholder="Angalau characters 6"
        autocomplete="new-password"
        required
      >

      <div class="form-row">

        <div>
          <label>Umri</label>

          <input
            id="registerAge"
            type="number"
            min="18"
            max="100"
            placeholder="18"
            required
          >
        </div>

        <div>
          <label>Jinsia</label>

          <select id="registerGender" required>
            <option value="">Chagua</option>
            <option value="Mwanaume">Mwanaume</option>
            <option value="Mwanamke">Mwanamke</option>
          </select>
        </div>

      </div>

      <label>Mji</label>

      <input
        id="registerCity"
        type="text"
        placeholder="Mfano: Dar es Salaam"
        required
      >

      <label>Bio</label>

      <textarea
        id="registerBio"
        maxlength="500"
        placeholder="Jieleze kidogo..."
      ></textarea>

      <label>Picha</label>

      <input
        id="registerPhoto"
        type="file"
        accept="image/jpeg,image/png,image/webp"
      >

      <div id="registerPhotoPreview" class="photo-preview"></div>

      <button
        id="registerBtn"
        class="primary-btn"
        type="submit"
      >
        Jisajili
      </button>

    </form>

    <div class="switch">
      Una account tayari?
      <button
        type="button"
        onclick="showLogin()"
      >
        Login
      </button>
    </div>

  </div>

</section>


<!-- =========================
     APP
========================= -->

<section id="appSection" class="hidden">

  <nav>

    <button
      id="navDiscover"
      class="active"
      type="button"
      onclick="showDiscover()"
    >
      🔎 Watu
    </button>

    <button
      id="navMatches"
      type="button"
      onclick="showMatches()"
    >
      ❤️ Matches
    </button>

    <button
      id="navNotifications"
      type="button"
      onclick="showNotifications()"
    >
      🔔 Notifications
    </button>

    <button
      id="navProfile"
      type="button"
      onclick="showProfile()"
    >
      👤 Profile
    </button>

  </nav>


  <main class="container">

    <!-- DISCOVER -->

    <section id="discoverSection">

      <h2 class="section-title">
        🔎 Watu wapya
      </h2>

      <div id="discoverList" class="grid">
        <div class="loading">
          Inapakia...
        </div>
      </div>

    </section>


    <!-- MATCHES -->

    <section id="matchesSection" class="hidden">

      <h2 class="section-title">
        ❤️ Matches zako
      </h2>

      <div id="matchesList" class="grid">
        <div class="loading">
          Inapakia...
        </div>
      </div>

    </section>


    <!-- NOTIFICATIONS -->

    <section id="notificationsSection" class="hidden">

      <div class="notifications-box">

        <div style="
          display:flex;
          justify-content:space-between;
          align-items:center;
          gap:10px;
        ">

          <h2>🔔 Notifications</h2>

          <button
            class="secondary-btn"
            type="button"
            onclick="markNotificationsRead()"
          >
            Soma zote
          </button>

        </div>

        <div id="notificationsList">
          <div class="empty">
            Inapakia...
          </div>
        </div>

      </div>

    </section>


    <!-- PROFILE -->

    <section id="profileSection" class="hidden">

      <div class="profile-box">

        <h2>👤 Profile yangu</h2>

        <div id="profileMessage"></div>

        <div id="profilePhotoPreview" class="photo-preview">
        </div>

        <label>Badilisha picha</label>

        <input
          id="profilePhoto"
          type="file"
          accept="image/jpeg,image/png,image/webp"
        >

        <button
          id="removePhotoBtn"
          class="secondary-btn"
          type="button"
          onclick="removeProfilePhoto()"
        >
          Ondoa picha
        </button>

        <form id="profileForm">

          <label>Jina</label>

          <input
            id="profileName"
            type="text"
            required
          >

          <div class="form-row">

            <div>

              <label>Umri</label>

              <input
                id="profileAge"
                type="number"
                min="18"
                max="100"
                required
              >

            </div>

            <div>

              <label>Jinsia</label>

              <select id="profileGender" required>
                <option value="">Chagua</option>
                <option value="Mwanaume">Mwanaume</option>
                <option value="Mwanamke">Mwanamke</option>
              </select>

            </div>

          </div>

          <label>Mji</label>

          <input
            id="profileCity"
            type="text"
            required
          >

          <label>Bio</label>

          <textarea
            id="profileBio"
            maxlength="500"
          ></textarea>

          <button
            id="saveProfileBtn"
            class="primary-btn"
            type="submit"
          >
            Hifadhi Profile
          </button>

        </form>

      </div>

    </section>


    <!-- CHAT -->

    <section id="chatSection" class="hidden">

      <div class="chat-box">

        <button
          class="secondary-btn"
          type="button"
          onclick="showMatches()"
        >
          ← Rudi Matches
        </button>

        <h2 id="chatTitle">
          💬 Chat
        </h2>

        <div
          id="chatMessages"
          class="chat-messages"
        >
          <div class="empty">
            Inapakia...
          </div>
        </div>

        <form
          id="chatForm"
          class="chat-input"
        >

          <input
            id="chatInput"
            type="text"
            maxlength="2000"
            placeholder="Andika ujumbe..."
            required
          >

          <button
            id="sendMessageBtn"
            class="primary-btn"
            type="submit"
          >
            Tuma
          </button>

        </form>

      </div>

    </section>

  </main>

</section>


<script>

let currentUser = null;
let currentChatUser = null;
let profilePhotoData = "";
let registerPhotoData = "";


/* =========================
   HELPERS
========================= */

function $(id){
  return document.getElementById(id);
}


async function api(url, options = {}){

  const config = {
    credentials: "include",
    ...options,
    headers: {
      ...(options.body ? {
        "Content-Type":"application/json"
      } : {}),
      ...(options.headers || {})
    }
  };

  const response = await fetch(url, config);

  let data = {};

  try{
    data = await response.json();
  }catch{
    data = {};
  }

  if(!response.ok){
    throw new Error(
      data.error || "Kuna tatizo kwenye server."
    );
  }

  return data;
}


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function formatDate(date){

  try{
    return new Date(date).toLocaleString("sw-TZ");
  }catch{
    return "";
  }
}


function showMessage(id, message, type="error"){

  const el = $(id);

  if(!el) return;

  el.innerHTML = `
    <div class="${type}">
      ${escapeHTML(message)}
    </div>
  `;
}


function clearMessage(id){

  const el = $(id);

  if(el){
    el.innerHTML = "";
  }
}


/* =========================
   AUTH SCREENS
========================= */

function showLogin(){

  $("loginSection").classList.remove("hidden");
  $("registerSection").classList.add("hidden");
  $("appSection").classList.add("hidden");
  $("mainHeader").classList.add("hidden");

  clearMessage("loginMessage");
  clearMessage("registerMessage");
}


function showRegister(){

  $("loginSection").classList.add("hidden");
  $("registerSection").classList.remove("hidden");
  $("appSection").classList.add("hidden");
  $("mainHeader").classList.add("hidden");

  clearMessage("registerMessage");
}


function showApp(){

  $("loginSection").classList.add("hidden");
  $("registerSection").classList.add("hidden");
  $("appSection").classList.remove("hidden");
  $("mainHeader").classList.remove("hidden");

  showDiscover();
}


/* =========================
   LOGIN
========================= */

$("loginForm").addEventListener(
  "submit",
  async function(event){

    event.preventDefault();

    const email = $("loginEmail").value.trim();
    const password = $("loginPassword").value;

    if(!email || !password){
      showMessage(
        "loginMessage",
        "Weka email na password."
      );
      return;
    }

    const button = $("loginBtn");

    try{

      clearMessage("loginMessage");

      button.disabled = true;
      button.textContent = "Inaingia...";

      const data = await api(
        "/api/login",
        {
          method:"POST",
          body:JSON.stringify({
            email,
            password
          })
        }
      );

      if(!data.ok || !data.user){
        throw new Error(
          "Login haikukamilika."
        );
      }

      currentUser = data.user;

      localStorage.setItem(
        "tanzaniaDatingUser",
        JSON.stringify(data.user)
      );

      $("loginPassword").value = "";

      showApp();

      await Promise.allSettled([
        loadDiscover(),
        loadMatches(),
        loadProfile(),
        loadNotificationCount()
      ]);

    }catch(error){

      console.error(
        "LOGIN ERROR:",
        error
      );

      showMessage(
        "loginMessage",
        error.message ||
        "Email au password sio sahihi."
      );

    }finally{

      button.disabled = false;
      button.textContent = "Login";

    }

  }
);


/* =========================
   REGISTER PHOTO
========================= */

$("registerPhoto").addEventListener(
  "change",
  async function(){

    const file = this.files[0];

    if(!file){
      registerPhotoData = "";
      $("registerPhotoPreview").innerHTML = "";
      return;
    }

    if(file.size > 5 * 1024 * 1024){

      alert(
        "Picha ni kubwa sana. Maximum ni 5MB."
      );

      this.value = "";
      registerPhotoData = "";
      $("registerPhotoPreview").innerHTML = "";

      return;
    }

    try{

      registerPhotoData =
        await fileToBase64(file);

      $("registerPhotoPreview").innerHTML = `
        <img
          src="${registerPhotoData}"
          alt="Preview"
        >
      `;

    }catch{

      alert(
        "Imeshindikana kusoma picha."
      );

      this.value = "";
      registerPhotoData = "";

    }

  }
);


/* =========================
   REGISTER
========================= */

$("registerForm").addEventListener(
  "submit",
  async function(event){

    event.preventDefault();

    const data = {
      name:$("registerName").value.trim(),
      email:$("registerEmail").value.trim(),
      password:$("registerPassword").value,
      age:Number($("registerAge").value),
      gender:$("registerGender").value,
      city:$("registerCity").value.trim(),
      bio:$("registerBio").value.trim(),
      photo:registerPhotoData
    };

    const button = $("registerBtn");

    try{

      clearMessage("registerMessage");

      button.disabled = true;
      button.textContent = "Inasajili...";

      const result = await api(
        "/api/register",
        {
          method:"POST",
          body:JSON.stringify(data)
        }
      );

      currentUser = result.user;
