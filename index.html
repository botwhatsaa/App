<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tanzania Dating ❤️</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff5f8;
  color:#24131b
}
.hidden{display:none!important}

header{
  background:linear-gradient(135deg,#ff174f,#e60046);
  color:white;
  padding:15px;
  position:sticky;
  top:0;
  z-index:20
}
.header-inner{
  max-width:900px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between
}
.logo{font-size:21px;font-weight:bold}

.notification-btn{
  border:0;
  background:rgba(255,255,255,.18);
  color:white;
  width:45px;
  height:45px;
  border-radius:50%;
  font-size:23px;
  cursor:pointer;
  position:relative
}
.badge{
  position:absolute;
  top:-3px;
  right:-3px;
  background:#111;
  color:white;
  min-width:20px;
  height:20px;
  padding:2px 5px;
  border-radius:20px;
  font-size:12px;
  display:flex;
  align-items:center;
  justify-content:center
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px
}

.auth-box,
.profile-box,
.chat-box,
.notifications-box{
  max-width:500px;
  margin:35px auto;
  background:white;
  padding:25px;
  border-radius:18px;
  box-shadow:0 8px 30px rgba(0,0,0,.08)
}

h1,h2,h3{margin-top:0}

.form-group{margin-bottom:15px}

label{
  display:block;
  font-weight:bold;
  margin-bottom:6px
}

input,select,textarea{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px
}

textarea{
  min-height:100px;
  resize:vertical
}

button{cursor:pointer}

.primary-btn{
  width:100%;
  border:0;
  padding:14px;
  border-radius:10px;
  background:#ff174f;
  color:white;
  font-size:16px;
  font-weight:bold
}

.secondary-btn{
  border:0;
  background:#eee;
  padding:11px 15px;
  border-radius:10px
}

.message{
  margin:10px 0;
  min-height:20px
}
.error{color:#d60039}
.success{color:#008b45}

.auth-link{
  text-align:center;
  margin-top:15px
}
.auth-link button{
  background:none;
  border:0;
  color:#e60046;
  font-weight:bold
}

nav{
  display:flex;
  gap:8px;
  max-width:900px;
  margin:auto;
  padding:12px 20px;
  overflow-x:auto
}
nav button{
  border:0;
  padding:10px 14px;
  border-radius:20px;
  background:white;
  white-space:nowrap
}
nav button.active{
  background:#ff174f;
  color:white
}

.user-card{
  background:white;
  border-radius:18px;
  overflow:hidden;
  margin-bottom:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.08)
}

.user-photo{
  width:100%;
  height:330px;
  object-fit:cover;
  display:block
}

.no-photo{
  width:100%;
  height:330px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#ffe0e9;
  font-size:80px
}

.user-info{padding:18px}
.user-meta{color:#777;margin:7px 0}
.bio{margin:12px 0;line-height:1.5}

.card-actions{
  display:flex;
  gap:8px
}
.card-actions button{
  flex:1;
  padding:12px;
  border:0;
  border-radius:10px
}

.like-btn{
  background:#ff174f;
  color:white
}
.chat-btn{background:#eee}
.report-btn{background:#fff0f0}

.matches-list{
  display:grid;
  gap:15px
}

.match-card{
  background:white;
  padding:15px;
  border-radius:15px;
  display:flex;
  align-items:center;
  gap:15px
}

.match-photo{
  width:65px;
  height:65px;
  object-fit:cover;
  border-radius:50%;
  background:#ffe0e9
}

.empty{
  text-align:center;
  background:white;
  padding:35px 20px;
  border-radius:15px
}

.profile-photo-preview{
  width:130px;
  height:130px;
  border-radius:50%;
  object-fit:cover;
  display:block;
  margin:10px auto 20px;
  background:#ffe0e9
}

.file-btn{
  display:block;
  background:#eee;
  padding:13px;
  text-align:center;
  border-radius:10px;
  margin-bottom:10px
}

.chat-header{
  font-size:20px;
  font-weight:bold;
  margin-bottom:15px
}

.messages{
  height:400px;
  overflow-y:auto;
  background:#fff5f8;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px
}

.msg{
  max-width:80%;
  padding:10px 13px;
  border-radius:15px;
  margin-bottom:10px
}

.msg.me{
  margin-left:auto;
  background:#ff174f;
  color:white
}

.msg.them{background:#eee}

.chat-form{
  display:flex;
  gap:8px
}
.chat-form input{flex:1}
.chat-form button{
  border:0;
  background:#ff174f;
  color:white;
  padding:0 18px;
  border-radius:10px
}

.notification-item{
  padding:14px;
  border-bottom:1px solid #eee;
  display:flex;
  gap:12px
}

.notification-item.unread{
  background:#fff0f4
}

.notification-icon{font-size:25px}

.notification-content{flex:1}

.notification-title{font-weight:bold}

.notification-time{
  color:#888;
  font-size:12px;
  margin-top:5px
}

.notification-actions{
  display:flex;
  justify-content:flex-end;
  margin-bottom:10px
}

.logout{
  margin-left:auto;
  display:block;
  border:0;
  background:#222;
  color:white;
  padding:10px 15px;
  border-radius:10px
}
</style>
</head>

<body>

<!-- LOGIN / REGISTER -->

<div id="auth">

  <div id="loginPage">

    <div class="auth-box">

      <h1>❤️ Tanzania Dating</h1>
      <p>Ingia kwenye account yako</p>

      <div id="loginMessage" class="message"></div>

      <form id="loginForm">

        <div class="form-group">
          <label>Email</label>
          <input id="loginEmail" type="email" required>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input id="loginPassword" type="password" required>
        </div>

        <button class="primary-btn">
          Ingia
        </button>

      </form>

      <div class="auth-link">
        Huna account?
        <button onclick="showRegister()">
          Jisajili
        </button>
      </div>

    </div>

  </div>


  <div id="registerPage" class="hidden">

    <div class="auth-box">

      <h1>Jisajili ❤️</h1>

      <div id="registerMessage" class="message"></div>

      <form id="registerForm">

        <div class="form-group">
          <label>Jina</label>
          <input id="regName" maxlength="80" required>
        </div>

        <div class="form-group">
          <label>Email</label>
          <input id="regEmail" type="email" required>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input
            id="regPassword"
            type="password"
            minlength="6"
            required
          >
        </div>

        <div class="form-group">
          <label>Umri</label>
          <input
            id="regAge"
            type="number"
            min="18"
            max="100"
            required
          >
        </div>

        <div class="form-group">
          <label>Jinsia</label>

          <select id="regGender" required>
            <option value="">Chagua jinsia</option>
            <option value="Mwanaume">Mwanaume</option>
            <option value="Mwanamke">Mwanamke</option>
            <option value="Nyingine">Nyingine</option>
          </select>
        </div>

        <div class="form-group">
          <label>Mji</label>
          <input id="regCity" maxlength="80" required>
        </div>

        <div class="form-group">
          <label>Bio</label>
          <textarea id="regBio" maxlength="500"></textarea>
        </div>

        <div class="form-group">

          <label>Picha yako</label>

          <img
            id="regPhotoPreview"
            class="profile-photo-preview hidden"
          >

          <label class="file-btn">
            📷 Chagua picha

            <input
              id="regPhoto"
              type="file"
              accept="image/jpeg,image/png,image/webp"
              hidden
            >
          </label>

          <small>
            JPG, PNG au WEBP — maximum 5MB
          </small>

        </div>

        <button class="primary-btn">
          Jisajili
        </button>

      </form>

      <div class="auth-link">
        Una account?
        <button onclick="showLogin()">
          Ingia
        </button>
      </div>

    </div>

  </div>

</div>


<!-- APP -->

<div id="app" class="hidden">

<header>

  <div class="header-inner">

    <div class="logo">
      Tanzania Dating ❤️
    </div>

    <button
      class="notification-btn"
      onclick="showNotifications()"
      aria-label="Notifications"
    >
      🔔

      <span
        id="notificationBadge"
        class="badge hidden"
      >0</span>

    </button>

  </div>

</header>


<nav>

  <button
    id="navDiscover"
    class="active"
    onclick="showSection('discover')"
  >
    🔎 Discover
  </button>

  <button
    id="navMatches"
    onclick="showSection('matches')"
  >
    ❤️ Matches
  </button>

  <button
    id="navProfile"
    onclick="showSection('profile')"
  >
    👤 Profile
  </button>

  <button onclick="showNotifications()">
    🔔 Notifications
  </button>

</nav>


<div class="container">

  <div style="
    display:flex;
    align-items:center;
    margin-bottom:15px;
  ">

    <h2 style="margin:0">
      Karibu,
      <span id="welcomeName"></span>
      ❤️
    </h2>

    <button
      class="logout"
      onclick="logout()"
    >
      Toka
    </button>

  </div>


  <!-- DISCOVER -->

  <section id="discoverSection">

    <h2>Watu wapya</h2>

    <div id="discoverList">
      <div class="empty">
        Inapakia...
      </div>
    </div>

  </section>


  <!-- MATCHES -->

  <section id="matchesSection" class="hidden">

    <h2>❤️ Matches zako</h2>

    <div id="matchesList">
      <div class="empty">
        Inapakia...
      </div>
    </div>

  </section>


  <!-- PROFILE -->

  <section id="profileSection" class="hidden">

    <h2>👤 Profile yangu</h2>

    <div class="profile-box">

      <div
        id="profileMessage"
        class="message"
      ></div>

      <img
        id="profilePreview"
        class="profile-photo-preview"
      >

      <form id="profileForm">

        <div class="form-group">
          <label>Jina</label>
          <input
            id="profileName"
            maxlength="80"
            required
          >
        </div>

        <div class="form-group">
          <label>Umri</label>
          <input
            id="profileAge"
            type="number"
            min="18"
            max="100"
            required
          >
        </div>

        <div class="form-group">

          <label>Jinsia</label>

          <select id="profileGender">

            <option value="Mwanaume">
              Mwanaume
            </option>

            <option value="Mwanamke">
              Mwanamke
            </option>

            <option value="Nyingine">
              Nyingine
            </option>

          </select>

        </div>

        <div class="form-group">

          <label>Mji</label>

          <input
            id="profileCity"
            maxlength="80"
            required
          >

        </div>

        <div class="form-group">

          <label>Bio</label>

          <textarea
            id="profileBio"
            maxlength="500"
          ></textarea>

        </div>

        <div class="form-group">

          <label>Badilisha picha</label>

          <label class="file-btn">

            📷 Chagua picha

            <input
              id="profilePhotoFile"
              type="file"
              accept="image/jpeg,image/png,image/webp"
              hidden
            >

          </label>

          <button
            type="button"
            class="secondary-btn"
            onclick="removeProfilePhoto()"
          >
            🗑️ Ondoa picha
          </button>

          <p id="photoStatus"></p>

        </div>

        <button
          class="primary-btn"
          type="submit"
        >
          Hifadhi Profile
        </button>

      </form>

    </div>

  </section>


  <!-- CHAT -->

  <section id="chatSection" class="hidden">

    <button
      class="secondary-btn"
      onclick="backFromChat()"
    >
      ← Rudi
    </button>

    <div class="chat-box">

      <div
        class="chat-header"
        id="chatHeader"
      >
        💬 Chat
      </div>

      <div
        id="messages"
        class="messages"
      ></div>

      <form
        id="chatForm"
        class="chat-form"
      >

        <input
          id="messageInput"
          type="text"
          maxlength="2000"
          placeholder="Andika ujumbe..."
          required
        >

        <button>
          Tuma
        </button>

      </form>

    </div>

  </section>


  <!-- NOTIFICATIONS -->

  <section
    id="notificationsSection"
    class="hidden"
  >

    <div class="notifications-box">

      <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:10px;
      ">

        <h2>🔔 Notifications</h2>

        <button
          class="secondary-btn"
          onclick="markNotificationsRead()"
        >
          Soma zote
        </button>

      </div>

      <div id="notificationsList">

        <div class="empty">
          Inapakia...
        </div>

      </div>

    </div>

  </section>

</div>

</div>


<script>

let currentUser = null;
let chatUser = null;
let previousSection = "discover";
let selectedProfilePhoto = null;
let removePhoto = false;


/* API */

async function api(url, options = {}){

  const response = await fetch(url,{
    credentials:"same-origin",
    ...options,
    headers:{
      "Content-Type":"application/json",
      ...(options.headers || {})
    }
  });

  const data =
    await response.json().catch(() => ({}));

  if(!response.ok){
    throw new Error(
      data.error ||
      "Kuna tatizo limetokea."
    );
  }

  return data;
}


/* HELPERS */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function showMessage(id,text,type="error"){

  const el =
    document.getElementById(id);

  if(!el)return;

  el.className =
    "message " + type;

  el.textContent = text;
}


function clearMessage(id){

  const el =
    document.getElementById(id);

  if(el){
    el.className="message";
    el.textContent="";
  }

}


/* LOGIN / REGISTER */

function showLogin(){

  document
    .getElementById("loginPage")
    .classList.remove("hidden");

  document
    .getElementById("registerPage")
    .classList.add("hidden");

  clearMessage("loginMessage");
}


function showRegister(){

  document
    .getElementById("loginPage")
    .classList.add("hidden");

  document
    .getElementById("registerPage")
    .classList.remove("hidden");

  clearMessage("registerMessage");
}


/* LOGIN */

document
.getElementById("loginForm")
.addEventListener("submit",async e=>{

  e.preventDefault();

  clearMessage("loginMessage");

  try{

    const data =
      await api("/api/login",{
        method:"POST",

        body:JSON.stringify({

          email:
            document
            .getElementById("loginEmail")
            .value,

          password:
            document
            .getElementById("loginPassword")
            .value

        })
      });

    currentUser=data.user;

    enterApp();

  }catch(err){

    showMessage(
      "loginMessage",
      err.message
    );

  }

});


/* BASE64 */

function fileToBase64(file){

  return new Promise((resolve,reject)=>{

    const reader =
      new FileReader();

    reader.onload =
      ()=>resolve(reader.result);

    reader.onerror =
      reject;

    reader.readAsDataURL(file);

  });

}


/* REGISTER PHOTO */

document
.getElementById("regPhoto")
.addEventListener("change",async e=>{

  const file=e.target.files[0];

  if(!file)return;

  if(file.size>5*1024*1024){

    alert(
      "Picha ni kubwa sana. Maximum 5MB."
    );

    e.target.value="";

    return;
  }

  try{

    const base64 =
      await fileToBase64(file);

    const preview =
      document.getElementById(
        "regPhotoPreview"
      );

    preview.src=base64;

    preview.classList.remove(
      "hidden"
    );

    preview.dataset.photo=base64;

  }catch{

    alert(
      "Imeshindikana kusoma picha."
    );

  }

});


/* REGISTER */

document
.getElementById("registerForm")
.addEventListener("submit",async e=>{

  e.preventDefault();

  clearMessage("registerMessage");

  try{

    const preview =
      document.getElementById(
        "regPhotoPreview"
      );

    const photo =
      preview.dataset.photo || "";

    const data =
      await api("/api/register",{
        method:"POST",

        body:JSON.stringify({

          name:
            document
            .getElementById("regName")
            .value,

          email:
            document
            .getElementById("regEmail")
            .value,

          password:
            document
            .getElementById("regPassword")
            .value,

          age:
            document
            .getElementById("regAge")
            .value,

          gender:
            document
            .getElementById("regGender")
            .value,

          city:
            document
            .getElementById("regCity")
            .value,

          bio:
            document
            .getElementById("regBio")
            .value,

          photo

        })
      });

    currentUser=data.user;

    enterApp();

  }catch(err){

    showMessage(
      "registerMessage",
      err.message
    );

  }

});


/* SESSION */

async function checkSession(){

  try{

    const data =
      await api("/api/me");

    currentUser=data.user;

    enterApp();

  }catch{

    document
      .getElementById("auth")
      .classList.remove("hidden");

    document
      .getElementById("app")
      .classList.add("hidden");

  }

}


function enterApp(){

  document
    .getElementById("auth")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.remove("hidden");

  document
    .getElementById("welcomeName")
    .textContent=currentUser.name;

  fillProfile();

  showSection("discover");

  loadNotificationCount();

}


async function logout(){

  try{

    await api("/api/logout",{
      method:"POST"
    });

  }catch{}

  currentUser=null;
  chatUser=null;

  document
    .getElementById("app")
    .classList.add("hidden");

  document
    .getElementById("auth")
    .classList.remove("hidden");

  showLogin();

}


/* SECTIONS */

function showSection(section){

  if(section!=="chat"){
    previousSection=section;
  }

  [
    "discover",
    "matches",
    "profile",
    "chat",
    "notifications"
  ].forEach(s=>{

    const el =
      document.getElementById(
        s+"Section"
      );

    if(el){
      el.classList.toggle(
        "hidden",
        s!==section
      );
    }

  });

  [
    "Discover",
    "Matches",
    "Profile"
  ].forEach(name=>{

    const btn =
      document.getElementById(
        "nav"+name
      );

    if(btn){

      btn.classList.toggle(
        "active",
        name.toLowerCase()===section
      );

    }

  });

  if(section==="discover")
    loadDiscover();

  if(section==="matches")
    loadMatches();

  if(section==="profile")
    fillProfile();

  if(section==="notifications")
    loadNotifications();

}


function showNotifications(){

  showSection("notifications");

}


/* DISCOVER */

async function loadDiscover(){

  const box =
    document.getElementById(
      "discoverList"
    );

  box.innerHTML =
    '<div class="empty">Inapakia...</div>';

  try{

    const users =
      await api("/api/discover");

    if(!users.length){

      box.innerHTML=`
        <div class="empty">
          <h3>Hakuna users bado ❤️</h3>
          <p>
            Watu wapya wakijiunga
            wataonekana hapa.
          </p>
        </div>
      `;

      return;
    }

    box.innerHTML="";

    users.forEach(user=>{
      box.appendChild(
        userCard(user)
      );
    });

  }catch(err){

    box.innerHTML=`
      <div class="empty">
        ${escapeHtml(err.message)}
      </div>
    `;

  }

}


function userCard(user){

  const card =
    document.createElement("div");

  card.className="user-card";

  let photo="";

  if(user.photo){

    photo=`
      <img
        class="user-photo"
        src="${user.photo}"
        alt="Picha"
      >
    `;

  }else{

    photo=`
      <div class="no-photo">
        👤
      </div>
    `;

  }

  card.innerHTML=`

    ${photo}

    <div class="user-info">

      <h3>
        ${
