<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tanzania Dating</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff5f8;
  color:#24131b
}

button,input,textarea,select{font:inherit}

button{cursor:pointer}

.hidden{display:none!important}

.center{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px
}

.card{
  background:#fff;
  border-radius:18px;
  padding:22px;
  box-shadow:0 8px 30px rgba(0,0,0,.08)
}

.auth-card{
  width:100%;
  max-width:430px
}

.logo{
  text-align:center;
  color:#e91e63;
  margin-bottom:8px
}

.subtitle{
  text-align:center;
  color:#777
}

input,textarea,select{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:10px;
  outline:none;
  background:#fff
}

input:focus,textarea:focus,select:focus{
  border-color:#e91e63
}

textarea{
  min-height:90px;
  resize:vertical
}

.btn{
  width:100%;
  border:0;
  border-radius:10px;
  padding:13px;
  margin-top:8px;
  font-weight:bold
}

.primary{
  background:#e91e63;
  color:#fff
}

.secondary{
  background:#fce4ec;
  color:#c2185b
}

.link-btn{
  border:0;
  background:none;
  color:#e91e63;
  font-weight:bold
}

.message{
  display:none;
  padding:11px;
  border-radius:10px;
  margin:10px 0;
  font-size:14px
}

.error{
  background:#ffebee;
  color:#c62828
}

.success{
  background:#e8f5e9;
  color:#2e7d32
}

/* APP */

header{
  background:linear-gradient(135deg,#ff174f,#e91e63);
  color:#fff;
  padding:15px;
  position:sticky;
  top:0;
  z-index:20
}

.header-inner{
  max-width:1000px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px
}

.brand{
  font-size:20px;
  font-weight:bold
}

.header-actions{
  display:flex;
  gap:7px
}

.header-actions button{
  border:0;
  background:rgba(255,255,255,.18);
  color:#fff;
  padding:9px 11px;
  border-radius:9px
}

.badge{
  background:#fff;
  color:#e91e63;
  border-radius:50%;
  min-width:19px;
  height:19px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:bold
}

main{
  max-width:1000px;
  margin:auto;
  padding:18px
}

.section{display:none}

.section.active{display:block}

.users-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:15px
}

.user-card{
  background:#fff;
  border-radius:17px;
  overflow:hidden;
  box-shadow:0 5px 20px rgba(0,0,0,.08)
}

.user-photo{
  width:100%;
  height:280px;
  background:#f8bbd0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-size:60px;
  color:#ad1457
}

.user-photo img{
  width:100%;
  height:100%;
  object-fit:cover
}

.user-info{
  padding:15px
}

.user-name{
  font-size:20px;
  font-weight:bold
}

.user-meta{
  color:#777;
  font-size:14px;
  margin:5px 0
}

.user-bio{
  color:#555;
  font-size:14px;
  line-height:1.4;
  margin:8px 0
}

.user-actions{
  display:flex;
  gap:8px
}

.user-actions button{
  flex:1;
  border:0;
  border-radius:10px;
  padding:11px;
  font-weight:bold
}

.like-btn{
  background:#e91e63;
  color:#fff
}

.message-btn{
  background:#fce4ec;
  color:#c2185b
}

.empty{
  background:#fff;
  padding:25px;
  border-radius:15px;
  text-align:center;
  color:#777
}

.loading{
  text-align:center;
  padding:25px;
  color:#777
}

/* PROFILE */

.profile-box{
  max-width:600px;
  margin:auto
}

.profile-photo{
  width:150px;
  height:150px;
  border-radius:50%;
  margin:0 auto 20px;
  background:#f8bbd0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-size:50px
}

.profile-photo img{
  width:100%;
  height:100%;
  object-fit:cover
}

/* CHAT */

.chat-box{
  max-width:700px;
  margin:auto;
  background:#fff;
  border-radius:16px;
  overflow:hidden
}

.chat-header{
  padding:15px;
  background:#e91e63;
  color:#fff;
  font-weight:bold
}

.messages{
  height:400px;
  overflow-y:auto;
  padding:15px;
  background:#fff8fa
}

.msg{
  max-width:75%;
  padding:10px 13px;
  border-radius:14px;
  margin-bottom:9px;
  font-size:14px;
  line-height:1.4
}

.msg.me{
  margin-left:auto;
  background:#e91e63;
  color:#fff
}

.msg.them{
  background:#eee;
  color:#222
}

.chat-input{
  display:flex;
  gap:8px;
  padding:12px;
  border-top:1px solid #eee
}

.chat-input input{
  margin:0;
  flex:1
}

.chat-input button{
  width:auto;
  margin:0
}

/* NOTIFICATIONS */

.notification{
  background:#fff;
  border-radius:14px;
  padding:15px;
  margin-bottom:10px;
  box-shadow:0 3px 12px rgba(0,0,0,.06)
}

.notification.unread{
  border-left:4px solid #e91e63
}

.notification-title{
  font-weight:bold;
  margin-bottom:5px
}

.notification-message{
  color:#666;
  font-size:14px
}

@media(max-width:600px){
  .users-grid{
    grid-template-columns:1fr
  }

  .user-photo{
    height:320px
  }

  .header-inner{
    flex-wrap:wrap
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="center">

  <div class="card auth-card">

    <h1 class="logo">❤️ Tanzania Dating</h1>

    <p class="subtitle">
      Karibu Tanzania Dating
    </p>

    <div id="loginMessage" class="message"></div>

    <form id="loginForm">

      <input
        id="loginEmail"
        type="email"
        placeholder="Email"
        autocomplete="email"
        required
      >

      <input
        id="loginPassword"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <button
        id="loginBtn"
        class="btn primary"
        type="submit"
      >
        Ingia
      </button>

    </form>

    <p style="text-align:center">
      Huna account?
      <button
        id="showRegisterBtn"
        class="link-btn"
        type="button"
      >
        Jisajili
      </button>
    </p>

  </div>
</div>


<!-- REGISTER -->
<div id="registerPage" class="center hidden">

  <div class="card auth-card">

    <h1 class="logo">❤️ Jisajili</h1>

    <p class="subtitle">
      Tengenza account yako
    </p>

    <div id="registerMessage" class="message"></div>

    <form id="registerForm">

      <input
        id="registerName"
        type="text"
        placeholder="Jina lako"
        required
      >

      <input
        id="registerEmail"
        type="email"
        placeholder="Email"
        required
      >

      <input
        id="registerPassword"
        type="password"
        placeholder="Password"
        required
      >

      <input
        id="registerAge"
        type="number"
        min="18"
        max="100"
        placeholder="Umri"
        required
      >

      <select id="registerGender" required>
        <option value="">Chagua jinsia</option>
        <option value="Mwanaume">Mwanaume</option>
        <option value="Mwanamke">Mwanamke</option>
      </select>

      <input
        id="registerCity"
        type="text"
        placeholder="Mji"
        required
      >

      <textarea
        id="registerBio"
        placeholder="Jieleze kidogo..."
      ></textarea>

      <label>
        <b>Picha yako</b>
      </label>

      <input
        id="registerPhoto"
        type="file"
        accept="image/jpeg,image/png,image/webp"
      >

      <small style="color:#777">
        Picha isiwe zaidi ya 5MB.
      </small>

      <button
        id="registerBtn"
        class="btn primary"
        type="submit"
      >
        Jisajili
      </button>

    </form>

    <p style="text-align:center">
      Una account?
      <button
        id="showLoginBtn"
        class="link-btn"
        type="button"
      >
        Ingia
      </button>
    </p>

  </div>
</div>


<!-- APP -->
<div id="app" class="hidden">

<header>

  <div class="header-inner">

    <div class="brand">
      ❤️ Tanzania Dating
    </div>

    <div class="header-actions">

      <button onclick="showSection('discover')">
        🏠
      </button>

      <button onclick="showSection('notifications')">
        🔔
        <span
          id="notificationBadge"
          class="badge hidden"
        >
          0
        </span>
      </button>

      <button onclick="showSection('profile')">
        👤
      </button>

      <button onclick="logout()">
        🚪
      </button>

    </div>

  </div>

</header>


<main>

<!-- DISCOVER -->
<section
  id="discoverSection"
  class="section active"
>

  <h2>
    Watu wapya
  </h2>

  <div id="usersGrid">
    <div class="loading">
      Inapakia...
    </div>
  </div>

</section>


<!-- NOTIFICATIONS -->
<section
  id="notificationsSection"
  class="section"
>

  <div style="
    display:flex;
    justify-content:space-between;
    align-items:center;
  ">

    <h2>🔔 Notifications</h2>

    <button
      class="link-btn"
      onclick="markNotificationsRead()"
    >
      Mark all read
    </button>

  </div>

  <div id="notificationsList">
    <div class="loading">
      Inapakia...
    </div>
  </div>

</section>


<!-- PROFILE -->
<section
  id="profileSection"
  class="section"
>

  <div class="profile-box">

    <div class="card">

      <h2>
        👤 Profile yangu
      </h2>

      <div
        id="profileMessage"
        class="message"
      ></div>

      <div
        id="profilePhotoBox"
        class="profile-photo"
      >
        👤
      </div>

      <input
        id="profilePhoto"
        type="file"
        accept="image/jpeg,image/png,image/webp"
      >

      <input
        id="profileName"
        type="text"
        placeholder="Jina"
      >

      <input
        id="profileAge"
        type="number"
        min="18"
        max="100"
        placeholder="Umri"
      >

      <select id="profileGender">
        <option value="">
          Chagua jinsia
        </option>
        <option value="Mwanaume">
          Mwanaume
        </option>
        <option value="Mwanamke">
          Mwanamke
        </option>
      </select>

      <input
        id="profileCity"
        type="text"
        placeholder="Mji"
      >

      <textarea
        id="profileBio"
        placeholder="Bio"
      ></textarea>

      <button
        id="saveProfileBtn"
        class="btn primary"
        onclick="saveProfile()"
      >
        Hifadhi Profile
      </button>

    </div>

  </div>

</section>


<!-- CHAT -->
<section
  id="chatSection"
  class="section"
>

  <button
    class="btn secondary"
    onclick="showSection('discover')"
  >
    ← Rudi
  </button>

  <br><br>

  <div class="chat-box">

    <div
      id="chatHeader"
      class="chat-header"
    >
      💬 Chat
    </div>

    <div
      id="messagesList"
      class="messages"
    >
      <div class="loading">
        Inapakia...
      </div>
    </div>

    <form
      id="messageForm"
      class="chat-input"
    >

      <input
        id="messageInput"
        type="text"
        placeholder="Andika ujumbe..."
        autocomplete="off"
        required
      >

      <button
        type="submit"
        class="btn primary"
      >
        Tuma
      </button>

    </form>

  </div>

</section>

</main>
</div>


<script>

let currentUser = null;
let currentChatUser = null;
let notificationTimer = null;


/* =========================
   API
========================= */

async function api(url, options = {}) {

  const config = {
    ...options,
    credentials:"include",
    headers:{
      "Content-Type":"application/json",
      ...(options.headers || {})
    }
  };

  const response =
    await fetch(url, config);

  let data = {};

  try {
    data = await response.json();
  } catch(e) {}

  if (!response.ok) {

    const error = new Error(
      data.error ||
      "Kuna tatizo kwenye server."
    );

    error.status =
      response.status;

    throw error;
  }

  return data;
}


/* =========================
   MESSAGE
========================= */

function showMessage(id,text,type){

  const el =
    document.getElementById(id);

  if(!el)return;

  el.textContent = text;

  el.className =
    "message " + type;

  el.style.display = "block";
}


/* =========================
   LOGIN / REGISTER PAGES
========================= */

function showLogin(){

  document
    .getElementById("loginPage")
    .classList.remove("hidden");

  document
    .getElementById("registerPage")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.add("hidden");
}


function showRegister(){

  document
    .getElementById("loginPage")
    .classList.add("hidden");

  document
    .getElementById("registerPage")
    .classList.remove("hidden");

  document
    .getElementById("app")
    .classList.add("hidden");
}


function showApp(){

  document
    .getElementById("loginPage")
    .classList.add("hidden");

  document
    .getElementById("registerPage")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.remove("hidden");
}


document
  .getElementById("showRegisterBtn")
  .onclick = showRegister;


document
  .getElementById("showLoginBtn")
  .onclick = showLogin;


/* =========================
   LOGIN
========================= */

document
  .getElementById("loginForm")
  .addEventListener("submit",async e=>{

  e.preventDefault();

  const btn =
    document.getElementById("loginBtn");

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;

  if(!email || !password){

    showMessage(
      "loginMessage",
      "Weka email na password.",
      "error"
    );

    return;
  }

  btn.disabled = true;
  btn.textContent = "Inaingia...";

  try{

    const result =
      await api("/api/login",{
        method:"POST",
        body:JSON.stringify({
          email,
          password
        })
      });

    if(!result.ok){
      throw new Error(
        "Login imeshindikana."
      );
    }

    currentUser =
      result.user;

    showApp();

    await loadDiscover();
    await loadNotifications();

    startNotifications();

  }catch(error){

    console.error(error);

    showMessage(
      "loginMessage",
      error.message,
      "error"
    );

  }finally{

    btn.disabled = false;
    btn.textContent = "Ingia";

  }

});


/* =========================
   REGISTER
========================= */

document
  .getElementById("registerForm")
  .addEventListener("submit",async e=>{

  e.preventDefault();

  const btn =
    document.getElementById("registerBtn");

  const name =
    document.getElementById("registerName")
      .value.trim();

  const email =
    document.getElementById("registerEmail")
      .value.trim();

  const password =
    document.getElementById("registerPassword")
      .value;

  const age =
    Number(
      document.getElementById("registerAge")
        .value
    );

  const gender =
    document.getElementById("registerGender")
      .value;

  const city =
    document.getElementById("registerCity")
      .value.trim();

  const bio =
    document.getElementById("registerBio")
      .value.trim();

  const file =
    document.getElementById("registerPhoto")
      .files[0];

  if(
    !name ||
    !email ||
    !password ||
    !age ||
    !gender ||
    !city
  ){

    showMessage(
      "registerMessage",
      "Jaza taarifa zote zinazohitajika.",
      "error"
    );

    return;
  }

  if(age < 18){

    showMessage(
      "registerMessage",
      "Lazima uwe na miaka 18 au zaidi.",
      "error"
    );

    return;
  }

  if(password.length < 6){

    showMessage(
      "registerMessage",
      "Password iwe na angalau characters 6.",
      "error"
    );

    return;
  }

  btn.disabled = true;
  btn.textContent = "Inasajili...";

  try{

    let photo = "";

    if(file){

      if(
        file.size >
        5 * 1024 * 1024
      ){

        throw new Error(
          "Picha isizidi 5MB."
        );
      }

      photo =
        await fileToDataURL(file);
    }

    const result =
      await api("/api/register",{

        method:"POST",

        body:JSON.stringify({
          name,
          email,
          password,
          age,
          gender,
          city,
          bio,
          photo
        })

      });

    if(!result.ok){

      throw new Error(
        result.error ||
        "Usajili umeshindikana."
      );
    }

    currentUser =
      result.user;

    showApp();

    await loadDiscover();
    await loadNotifications();

    startNotifications();

  }catch(error){

    console.error(error);

    showMessage(
      "registerMessage",
      error.message,
      "error"
    );

  }finally{

    btn.disabled = false;
    btn.textContent = "Jisajili";

  }

});


function fileToDataURL(file){

  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();

      reader.onload =
        ()=>resolve(reader.result);

      reader.onerror =
        ()=>reject(
          new Error(
            "Picha haikuweza kusomwa."
          )
        );

      reader.readAsDataURL(file);

    }
  );
}


/* =========================
   SECTIONS
========================= */

function showSection(name){

  document
    .querySelectorAll(".section")
    .forEach(x=>{
      x.classList.remove("active");
    });

  const section =
    document.getElementById(
      name + "Section"
    );

  if(section)
    section.classList.add("active");

  if(name==="discover")
    loadDiscover();

  if(name==="notifications")
    loadNotifications();

  if(name==="profile")
    loadProfile();

}


/* =========================
   DISCOVER
========================= */

async function loadDiscover(){

  const grid =
    document.getElementById(
      "usersGrid"
    );

  grid.innerHTML =
    `<div class="loading">
      Inapakia watu...
    </div>`;

  try{

    const users =
      await api("/api/discover");

    grid.innerHTML = "";

    if(!users.length){

      grid.innerHTML =
        `<div class="empty">
          Hakuna watu wapya kwa sasa.
        </div>`;

      return;
    }

    users.forEach(user=>{

      grid.appendChild(
        createUserCard(user)
      );

    });

  }catch(error){

    console.error(error);

    grid.innerHTML =
      `<div class="empty">
        ${escapeHtml(error.message)}
      </div>`;

    if(error.status===401)
      forceLogout();

  }

}


function createUserCard(user){

  const card =
    document.createElement("div");

  card.className =
    "user-card";


  const photo =
    document.createElement("div");

  photo.className =
    "user-photo";


  if(user.photo){

    const img =
      document.createElement("img");

    img.src =
      user.photo;

    img.alt =
      user.name || "Picha";

    img.onerror = ()=>{
      img.remove();
      photo.textContent = "👤";
    };

    photo.appendChild(img);

  }else{

    photo.textContent = "👤";

  }


  const info =
    document.createElement("div");

  info.className =
    "user-info";


  const name =
    document.createElement("div");

  name.className =
    "user-name";

  name.textContent =
    `${user.name || "User"}${
      user.age ? ", " + user.age : ""
    }`;


  const meta =
    document.createElement("div");

  meta.className =
    "user-meta";

  meta.textContent =
    `${user.city || ""}${
      user.gender
      ? " · " + user.gender
      : ""
    }`;


  const bio =
    document.createElement("div");

  bio.className =
    "user-bio";

  bio.textContent =
    user.bio ||
    "Hakuna bio bado.";


  const actions =
    document.createElement("div");

  actions.className =
    "user-actions";


  const like =
    document.createElement("button");

  like.className =
    "like-btn";

  like.textContent =
    "❤️ Like";

  like.onclick =
    ()=>likeUser(user.id,like);


  const chat =
    document.createElement("button");

  chat.className =
    "message-btn";

  chat.textContent =
    "💬 Chat";

  chat.onclick =
    ()=>openChat(user);


  actions.appendChild(like);
  actions.appendChild(chat);


  info.appendChild(name);
  info.appendChild(meta);
  info.appendChild(bio);
  info.appendChild(actions);


  card.appendChild(photo);
  card.appendChild(info);


  return card;
}


/* =========================
   LIKE
========================= */

async function likeUser(userId,button){

  button.disabled = true;

  try{

    const result =
      await api("/api/like",{

        method:"POST",

        body:JSON.stringify({
          userId
        })

      });

    if(result.matched){

      alert(
        "🎉 Mme-match!"
      );

    }else{

      button.textContent =
        "❤️ Liked";

    }

    await loadNotifications();

  }catch(error){

    console.error(error);

    button.disabled = false;

    button.textContent =
      "❤️ Like";

    if(error.status===401)
      forceLogout();
    else
      alert(error.message);

  }

}


/* =========================
   CHAT
========================= */

function openChat(user){

  currentChatUser =
    user;

  document
    .getElementById("chatHeader")
    .textContent =
      "💬 " +
      (user.name || "Chat");

  showSection("chat");

  loadMessages();

}


async function loadMessages(){

  if(!currentChatUser)
    return;

  const list =
    document.getElementById(
      "messagesList"
    );

  list.innerHTML =
    `<div class="loading">
      Inapakia ujumbe...
    </div>`;


  try{

    /*
      MUHIMU:
      Server yako inatumia
      /api/messages/:id
    */

    const messages =
      await api(
        "/api/messages/" +
        encodeURIComponent(
          currentChatUser.id
        )
      );


    list.innerHTML = "";


    if(!messages.length){

      list.innerHTML =
        `<div class="empty">
          Hakuna ujumbe bado.
        </div>`;

      return;
    }


    messages.forEach(message=>{

      const div =
        document.createElement("div");

      /*
        Server yako inatumia:
        sender
        receiver
        body
      */

      const mine =
        Number(message.sender) ===
        Number(currentUser.id);

      div.className =
        "msg " +
        (mine ? "me" : "them");

      div.textContent =
        message.body || "";

      list.appendChild(div);

    });


    list.scrollTop =
      list.scrollHeight;


  }catch(error){

    console.error(
      "CHAT ERROR:",
      error
    );

    list.innerHTML =
      `<div class="empty">
        ${escapeHtml(error.message)}
      </div>`;

    if(error.status===401)
      forceLogout();

  }

}


/* =========================
   SEND MESSAGE
========================= */

document
  .getElementById("messageForm")
  .addEventListener(
    "submit",
    async e=>{

      e.preventDefault();

      if(!currentChatUser)
        return;


      const input =
        document.getElementById(
          "messageInput"
        );

      const text =
        input.value.trim();


      if(!text)
        return;


      const button =
        e.target.querySelector(
          "button"
        );

      button.disabled = true;


      try{

        /*
          MUHIMU:
          Server yako inatumia:
          POST /api/messages/:id

          na body:
          { body: "ujumbe" }
        */

        await api(
          "/api/messages/" +
          encodeURIComponent(
            currentChatUser.id
          ),
          {
            method:"POST",

            body:JSON.stringify({
              body:text
            })
          }
        );


        input.value = "";

        await loadMessages();

        await loadNotifications();


      }catch(error){

        console.error(
          "SEND MESSAGE ERROR:",
          error
        );

        if(error.status===401){

          forceLogout();

        }else{

          alert(
            error.message
          );

        }

      }finally{

        button.disabled = false;

      }

    }
  );

async function loadProfile(){

  try{

    const user =
      await api("/api/me");

    currentUser =
      user;

    document
      .getElementById("profileName")
      .value =
        user.name || "";

    document
      .getElementById("profileAge")
      .value =
        user.age || "";

    document
      .getElementById("profileGender")
      .value =
        user.gender || "";

    document
      .getElementById("profileCity")
      .value =
        user.city || "";

    document
      .getElementById("profileBio")
      .value =
        user.bio || "";


    const box =
      document.getElementById(
        "profilePhotoBox"
      );

    box.innerHTML = "";


    if(user.photo){

      const img =
        document.createElement("img");

      img.src =
        user.photo;

      box.appendChild(img);

    }else{

      box.textContent =
        "👤";

    }


  }catch(error){

    if(error.status===401)
      forceLogout();

  }

}


/* =========================
   SAVE PROFILE
========================= */

async function saveProfile(){

  const name =
    document
      .getElementById("profileName")
      .value.trim();

  const age =
    Number(
      document
        .getElementById("profileAge")
        .value
    );

  const gender =
    document
      .getElementById("profileGender")
      .value;

  const city =
    document
      .getElementById("profileCity")
      .value.trim();

  const bio =
    document
      .getElementById("profileBio")
      .value.trim();

  const file =
    document
      .getElementById("profilePhoto")
      .files[0];


  try{

    let photo =
      currentUser.photo || "";


    if(file){

      if(
        file.size >
        5 * 1024 * 1024
      ){

        throw new Error(
          "Picha isizidi 5MB."
        );
      }

      photo =
        await fileToDataURL(file);
    }


    /*
      Server yako inatumia
      POST /api/profile
    */

    const result =
      await api(
        "/api/profile",
        {
          method:"POST",

          body:JSON.stringify({
            name,
            age,
            gender,
            city,
            bio,
            photo
          })
        }
      );


    currentUser =
      result.user;


    showMessage(
      "profileMessage",
      "Profile imehifadhiwa.",
      "success"
    );


    document
      .getElementById(
        "profilePhoto"
      )
      .value = "";


    await loadProfile();


  }catch(error){

    console.error(error);

    if(error.status===401){

      forceLogout();

    }else{

      showMessage(
        "profileMessage",
        error.message,
        "error"
      );

    }

  }

}


/* =========================
   NOTIFICATIONS
========================= */

async function loadNotifications(){

  try{

    const result =
      await api(
        "/api/notifications"
      );

    const notifications =
      result.notifications || [];

    const unread =
      Number(
        result.unread || 0
      );


    const badge =
      document.getElementById(
        "notificationBadge"
      );


    if(unread > 0){

      badge.classList.remove(
        "hidden"
      );

      badge.textContent =
        unread > 99
          ? "99+"
          : unread;

    }else{

      badge.classList.add(
        "hidden"
      );

    }


    const list =
      document.getElementById(
        "notificationsList"
      );


    list.innerHTML = "";


    if(!notifications.length){

      list.innerHTML =
        `<div class="empty">
          Huna notifications bado.
        </div>`;

      return;
    }


    notifications.forEach(n=>{

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "notification " +
        (!n.read ? "unread" : "");


      const title =
        document.createElement(
          "div"
        );

      title.className =
        "notification-title";

      title.textContent =
        n.title || "Notification";


      const message =
        document.createElement(
          "div"
        );

      message.className =
        "notification-message";

      message.textContent =
        n.message || "";


      div.appendChild(title);
      div.appendChild(message);

      list.appendChild(div);

    });


  }catch(error){

    console.error(error);

    if(error.status===401)
      forceLogout();

  }

}


async function markNotificationsRead(){

  try{

    await api(
      "/api/notifications/read-all",
      {
        method:"POST",
        body:JSON.stringify({})
      }
    );

    await loadNotifications();

  }catch(error){

    console.error(error);

  }

}


function startNotifications(){

  if(notificationTimer)
    clearInterval(
      notificationTimer
    );

  notificationTimer =
    setInterval(
      loadNotifications,
      15000
    );
}


/* =========================
   LOGOUT
========================= */

async function logout(){

  try{

    await api(
      "/api/logout",
      {
        method:"POST",
        body:JSON.stringify({})
      }
    );

  }catch(error){

    console.error(error);

  }

  currentUser = null;
  currentChatUser = null;

  if(notificationTimer){

    clearInterval(
      notificationTimer
    );

    notificationTimer =
      null;
  }

  showLogin();

}


/* =========================
   FORCE LOGOUT
========================= */

function forceLogout(){

  currentUser = null;
  currentChatUser = null;

  if(notificationTimer){

    clearInterval(
      notificationTimer
    );

    notificationTimer =
      null;
  }

  showLogin();

  showMessage(
    "loginMessage",
    "Session imeisha. Ingia tena.",
    "error"
  );

}


/* =========================
   SESSION CHECK
========================= */

async function checkSession(){

  try{

    const user =
      await api("/api/me");

    currentUser =
      user;

    showApp();

    await loadDiscover();
    await loadNotifications();

    startNotifications();

  }catch(error){

    console.log(
      "Hakuna session."
    );

    showLogin();

  }

}


/* =========================
   ESCAPE
========================= */

function escapeHtml(value){

  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================
   START
========================= */

checkSession();
